name: Extract Video Links

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "extractor.py"
      - "requirements.txt"
      - "page.html"
      - ".github/workflows/extract.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Extract video links from HTML
        run: python extractor.py page.html

      - name: Upload links.txt
        uses: actions/upload-artifact@v4
        with:
          name: video-links
          path: links.txt
          if-no-files-found: error
          retention-days: 7
